<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enciclopedia</title>
<style>
  :root{
    --paper:#ffffff; --panel:#f6f6f4; --line:#e2e2dc;
    --ink:#111111; --ink-dim:#6b6b60;
    --moss:#586a45; --steel:#4f6b82; --warm:#b06a36;
    --mono:"Fira Code", ui-monospace, "SF Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
    --serif:"Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
    --r:2px;
  }
  body.oscuro{
    --paper:#16170f; --panel:#1f2017; --line:#33352a;
    --ink:#d8d6c4; --ink-dim:#8a8c78;
    --moss:#8fa676; --steel:#7d99b0; --warm:#c08a5a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper); color:var(--ink); font-family:var(--mono); font-size:12px; line-height:1.5; min-height:100vh}

  header{
    display:flex; align-items:baseline; gap:16px; padding:10px 16px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  #marca{font-size:12px; font-weight:600; letter-spacing:.18em; color:var(--ink); text-decoration:none; white-space:nowrap}
  #marca:hover{color:var(--moss)}
  #cuenta{flex:1; color:var(--ink-dim); font-size:11px; font-variant-numeric:tabular-nums}
  button{
    font-family:var(--mono); font-size:11px; letter-spacing:.03em; cursor:pointer;
    border-radius:var(--r); padding:6px 10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); transition:border-color .12s, color .12s;
  }
  button:hover{border-color:var(--moss); color:var(--moss)}
  a:focus-visible, button:focus-visible{outline:1px solid var(--moss); outline-offset:2px}

  main{max-width:76ch; margin:0 auto; padding:40px 24px 96px}

  /* grupos por letra: la inicial en el margen, las entradas en la columna */
  .grupo{display:grid; grid-template-columns:3.2rem 1fr; column-gap:18px; padding:18px 0 14px; border-top:1px solid var(--line)}
  .grupo:first-child{border-top:none; padding-top:0}
  .letra{
    font-family:var(--serif); font-size:2.6rem; line-height:1; color:var(--moss);
    text-align:right; padding-top:2px; user-select:none;
  }
  .entradas{list-style:none; margin:0; padding:0}
  .entradas li{margin:0 0 14px}
  .entradas li:last-child{margin-bottom:4px}
  .entradas a{
    font-family:var(--serif); font-size:19px; line-height:1.3; color:var(--ink);
    text-decoration:none; border-bottom:1px solid transparent; transition:border-color .12s, color .12s;
  }
  .entradas a:hover{color:var(--steel); border-bottom-color:var(--steel)}
  .archivo{display:block; color:var(--ink-dim); font-size:10.5px; margin-top:2px}

  .aviso{color:var(--ink-dim); font-size:12px; line-height:1.6; max-width:60ch}
  .aviso b{color:var(--ink); font-weight:600}
  .aviso code{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:0 .3em}

  @media (max-width:560px){
    main{padding:28px 16px 72px}
    .grupo{grid-template-columns:2.2rem 1fr; column-gap:12px}
    .letra{font-size:1.9rem}
    .entradas a{font-size:17px}
  }
</style>
</head>
<body>
  <header>
    <a id="marca" href="./">ENCICLOPEDIA</a>
    <span id="cuenta" aria-live="polite"></span>
    <button id="tema" type="button" title="Cambiar tema">oscuro</button>
  </header>
  <main id="lista" aria-busy="true">
    <p class="aviso">Cargando entradas…</p>
  </main>

<script>
/* === NÚCLEO PURO (sin DOM). Idéntico en index.html y lector.html; probado en Node. === */
const NUCLEO = (function(){
  'use strict';
  const CARPETA = 'entradas/';

  function sinBom(s){ return String(s || '').replace(/^\uFEFF/, ''); }

  // quita un bloque YAML inicial (--- … ---) si existe; lo demás intacto
  function quitarFrontMatter(md){
    md = sinBom(md);
    const m = md.match(/^---[ \t]*\r?\n[\s\S]*?\r?\n(?:---|\.\.\.)[ \t]*(?:\r?\n|$)/);
    return m ? md.slice(m[0].length) : md;
  }

  // markdown en línea -> texto plano (para títulos)
  function limpiarInline(t){
    return t
      .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/`([^`]*)`/g, '$1')
      .replace(/(\*\*|__)(.+?)\1/g, '$2')
      .replace(/(\*|_)(.+?)\1/g, '$2')
      .replace(/\\([\\`*_{}\[\]()#+\-.!:])/g, '$1')
      .replace(/<[^>]+>/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // primer encabezado de nivel 1 (ATX "# x" o setext "x\n===") fuera de bloques de código
  function tituloDeMd(md){
    const lineas = quitarFrontMatter(md).split(/\r?\n/);
    let valla = null;
    for (let i = 0; i < lineas.length; i++){
      const l = lineas[i];
      const f = l.match(/^ {0,3}(`{3,}|~{3,})/);
      if (f){
        if (!valla) valla = f[1];
        else if (f[1][0] === valla[0] && f[1].length >= valla.length && /^ {0,3}(`{3,}|~{3,})\s*$/.test(l)) valla = null;
        continue;
      }
      if (valla) continue;
      const atx = l.match(/^ {0,3}#[ \t]+(.*?)(?:[ \t]+#+)?[ \t]*$/);
      if (atx){ const t = limpiarInline(atx[1]); if (t) return t; continue; }
      if (l.trim() && i + 1 < lineas.length && /^ {0,3}=+[ \t]*$/.test(lineas[i + 1])){
        const t = limpiarInline(l); if (t) return t;
      }
    }
    return null;
  }

  // "teoria-del_signo.md" -> "teoria del signo"
  function nombreLegible(nombre){
    return String(nombre).replace(/\.md$/i, '').replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim() || String(nombre);
  }

  // parámetro ?e= -> nombre seguro (sin .md) o null
  function validarNombre(e){
    if (typeof e !== 'string') return null;
    let n = e.trim().replace(/\.md$/i, '');
    if (!n || n.length > 200) return null;
    if (/[\/\\\u0000-\u001f]/.test(n) || n[0] === '.') return null;
    return n;
  }

  function rutaMd(nombre){ return CARPETA + encodeURIComponent(nombre) + '.md'; }
  function urlLector(nombre, frag){ return 'lector.html?e=' + encodeURIComponent(nombre) + (frag || ''); }

  // manifiesto {entradas:["/entradas/x.md", …]} -> [{archivo, nombre}] solo del nivel superior de entradas/
  function parsearManifiesto(data){
    const rutas = Array.isArray(data) ? data : (data && Array.isArray(data.entradas) ? data.entradas : null);
    if (!rutas) throw new Error('manifiesto sin lista «entradas»');
    const vistos = new Set(), out = [];
    for (const r of rutas){
      if (typeof r !== 'string') continue;
      const m = r.match(/^\/?entradas\/([^\/]+\.md)$/i);
      if (!m) continue;
      const archivo = m[1];
      const nombre = validarNombre(archivo);
      if (!nombre || vistos.has(nombre)) continue;
      vistos.add(nombre);
      out.push({ archivo, nombre });
    }
    return out;
  }

  const COLL = (typeof Intl !== 'undefined' && Intl.Collator)
    ? new Intl.Collator('es', { sensitivity:'base', numeric:true }) : null;
  function comparar(a, b){ return COLL ? COLL.compare(a, b) : (a < b ? -1 : a > b ? 1 : 0); }
  function ordenarEntradas(lista){
    return lista.slice().sort((x, y)=> comparar(x.titulo, y.titulo) || comparar(x.nombre, y.nombre));
  }

  // letra de agrupación del índice: sin tildes, mayúscula; lo no alfabético va a "#"
  function inicial(titulo){
    const c0 = String(titulo || '').trim().charAt(0).toUpperCase();
    const c = c0 === 'Ñ' ? c0 : c0.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return /[A-ZÑ]/.test(c) ? c : '#';
  }

  // href relativo dentro de una entrada -> href válido desde la raíz del sitio, o null si no se toca
  //  "otra.md#x" -> "lector.html?e=otra#x" ; "img/a.png" -> "entradas/img/a.png"
  function reescribirHref(href){
    if (!href) return null;
    href = String(href).trim();
    if (!href || href[0] === '#' || href[0] === '/' || href[0] === '?') return null;
    if (/^[a-z][a-z0-9+.\-]*:/i.test(href)) return null;       // http:, mailto:, data:, javascript:…
    const k = href.search(/[?#]/);
    let ruta = k === -1 ? href : href.slice(0, k);
    const resto = k === -1 ? '' : href.slice(k);
    ruta = ruta.replace(/^(\.\/)+/, '');
    if (!ruta || /^\.\.(\/|$)/.test(ruta)) return null;          // fuera de entradas/: no se adivina
    let dec = ruta; try { dec = decodeURIComponent(ruta); } catch(e){}
    if (/\.md$/i.test(dec) && dec.indexOf('/') === -1){
      const n = validarNombre(dec);
      if (n){ const frag = resto.indexOf('#') !== -1 ? resto.slice(resto.indexOf('#')) : ''; return urlLector(n, frag); }
    }
    return CARPETA + ruta + resto;
  }

  // ids estables para encabezados (anclas #seccion)
  function slug(t){
    return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      .replace(/[^a-z0-9ñ\s-]/g, '').trim().replace(/\s+/g, '-').replace(/-+/g, '-') || 'seccion';
  }

  // prefijo de localStorage por sitio: todos los repos de usuario.github.io comparten origen
  function baseSitio(pathname){ return String(pathname || '/').replace(/[^\/]*$/, ''); }
  function claveNotas(base, nombre){ return 'forja-enc:' + base + ':notas:' + nombre; }

  return { quitarFrontMatter, limpiarInline, tituloDeMd, nombreLegible, validarNombre, rutaMd, urlLector,
           parsearManifiesto, ordenarEntradas, inicial, reescribirHref, slug, baseSitio, claveNotas };
})();
if (typeof module !== 'undefined') module.exports = NUCLEO;
/* === FIN NÚCLEO === */
</script>
<script>
(function(){
  'use strict';
  const N = NUCLEO;
  const $ = (id)=> document.getElementById(id);
  const lista = $('lista'), cuenta = $('cuenta');
  const BASE = N.baseSitio(location.pathname);
  const kTitulo = (n)=> 'forja-enc:' + BASE + ':titulo:' + n;
  const leer = (k)=>{ try { return localStorage.getItem(k); } catch(e){ return null; } };
  const escribir = (k, v)=>{ try { localStorage.setItem(k, v); } catch(e){} };

  // ---- tema (compartido con el lector) ----
  function aplicarTema(o){ document.body.classList.toggle('oscuro', o); $('tema').textContent = o ? 'claro' : 'oscuro'; }
  $('tema').addEventListener('click', ()=>{
    const o = !document.body.classList.contains('oscuro');
    aplicarTema(o); escribir('forja-lector-tema', o ? 'oscuro' : 'claro');
  });
  aplicarTema(leer('forja-lector-tema') === 'oscuro');

  function aviso(html){ lista.innerHTML = '<p class="aviso">' + html + '</p>'; lista.setAttribute('aria-busy', 'false'); }

  function pintar(entradas){
    lista.setAttribute('aria-busy', 'false');
    cuenta.textContent = entradas.length + (entradas.length === 1 ? ' entrada' : ' entradas');
    if (!entradas.length){
      aviso('<b>Todavía no hay entradas.</b> Sube un archivo <code>.md</code> a la carpeta <code>entradas/</code> del repositorio; aparecerá aquí cuando GitHub Pages termine de publicar (suele tardar uno o dos minutos).');
      return;
    }
    const frag = document.createDocumentFragment();
    let grupo = null, ul = null, letraActual = null;
    for (const e of N.ordenarEntradas(entradas)){
      const L = N.inicial(e.titulo);
      if (L !== letraActual){
        letraActual = L;
        grupo = document.createElement('section'); grupo.className = 'grupo';
        const le = document.createElement('div'); le.className = 'letra'; le.textContent = L; le.setAttribute('aria-hidden', 'true');
        ul = document.createElement('ul'); ul.className = 'entradas'; ul.setAttribute('aria-label', 'Entradas con ' + L);
        grupo.append(le, ul); frag.appendChild(grupo);
      }
      const li = document.createElement('li');
      const a = document.createElement('a'); a.href = N.urlLector(e.nombre); a.textContent = e.titulo;
      const f = document.createElement('span'); f.className = 'archivo'; f.textContent = e.archivo;
      li.append(a, f); ul.appendChild(li);
    }
    lista.innerHTML = ''; lista.appendChild(frag);
  }

  // títulos reales: primer "# " de cada .md; concurrencia limitada, caché local para el primer pintado
  async function completarTitulos(entradas){
    let i = 0, cambios = 0;
    async function obrero(){
      while (i < entradas.length){
        const e = entradas[i++];
        try {
          const r = await fetch(N.rutaMd(e.nombre), { cache:'no-cache' });
          if (!r.ok) continue;
          const t = N.tituloDeMd(await r.text()) || N.nombreLegible(e.archivo);
          if (t !== e.titulo){ e.titulo = t; cambios++; }
          escribir(kTitulo(e.nombre), t);
        } catch(err){ /* sin red para esta entrada: se queda el título provisional */ }
      }
    }
    await Promise.all(Array.from({ length: Math.min(6, entradas.length) }, obrero));
    return cambios;
  }

  async function iniciar(){
    let data;
    try {
      const r = await fetch('entradas.json', { cache:'no-cache' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      data = JSON.parse(await r.text());
    } catch(err){
      aviso('<b>No se pudo leer <code>entradas.json</code>.</b> Ese archivo lo genera GitHub Pages al publicar; '
          + 'si abres el sitio desde tu equipo o el repositorio publica sin Jekyll (con <code>.nojekyll</code> o con un flujo de Actions estático), no existe. '
          + '<br>Detalle: ' + String(err.message).replace(/[<>&]/g, ''));
      return;
    }
    let entradas;
    try { entradas = N.parsearManifiesto(data); }
    catch(err){ aviso('<b><code>entradas.json</code> tiene un formato inesperado.</b>'); return; }
    entradas.forEach(e=>{ e.titulo = leer(kTitulo(e.nombre)) || N.nombreLegible(e.archivo); });
    pintar(entradas);
    if (entradas.length && await completarTitulos(entradas)) pintar(entradas);
  }
  iniciar();
})();
</script>
</body>
</html>
